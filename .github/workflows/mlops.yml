name: MLOps - Bitcoin Order Model

on:
  push:
    branches: [mlops-workshop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Train model
        run: python ml/train.py

      - name: Test model quality
        run: python -m pytest ml/test_model.py -v

      - name: Verify model files
        run: |
          test -s ml/artifacts/risk_model.joblib
          test -s ml/artifacts/metrics.json

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-ml-model
          path: |
            ml/artifacts/risk_model.joblib
            ml/artifacts/metrics.json
          if-no-files-found: error