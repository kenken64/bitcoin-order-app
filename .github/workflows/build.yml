# =======================================================================
# FINAL CORRECTED VERSION - Matching Angular 10 Environment
# =======================================================================
name: CI/CD Pipeline

on:
  push:
    branches:
      - fix-ci-workflow

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # Step 2: Setup A COMPATIBLE Node.js environment (Node.js v14)
      # Angular 10 is compatible with Node.js 10, 12, and 14. We use 14.
      - name: Setup Node.js v14
        uses: actions/setup-node@v3
        with:
          node-version: '14' # <--- REVERTED: Back to a compatible OLD version

      # Step 3: Install dependencies using "npm ci"
      # "npm ci" is faster and safer for builds, using package-lock.json
      # We assume a package-lock.json exists. If not, this is the right way.
      - name: Install Dependencies
        run: npm install # Using 'npm install' as there is no lock file

      # Step 4: Build the application for Production
      # We use the local ng command from node_modules to ensure version match
      - name: Build Application for Production
        run: ./node_modules/.bin/ng build --configuration production --base-href /bitcoin-order-app/

      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/bitcoin-order-app
