name: CI/CD Pipeline

on:
  push:
    branches:
      - fix-ci-workflow   # <-- IMPORTANT: Now triggers on our NEW branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Perform static code analysis (ng lint)
      - name: Perform static code analysis (ng lint)
        run: npm run lint
        continue-on-error: true

      # Step 5: Perform vulnerability scanning (npm audit)
      - name: Perform vulnerability scanning (npm audit)
        run: npm audit fix --force
        continue-on-error: true

      # Step 6: Build the application
      - name: Build Application for Production
        run: npm run build -- --configuration production --base-href /bitcoin-order-app/

      # Step 7: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/bitcoin-order-app

